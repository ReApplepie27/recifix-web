<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <script>
        if (window.location.search.includes("embedded")) {
            document.documentElement.classList.add("auth-embedded");
        }
    </script>

    <title>Log In - Recifix</title>

    <link rel="stylesheet" href="../css/account.css">
</head>

<body class="auth-page">

    <div class="auth-background">

        <iframe
            src="../index.html"
            title="Recifix Homepage"
            onload="prepareAuthBackground(this)">
        </iframe>

    </div>

    <div class="auth-overlay"></div>

    <main class="auth-wrapper">

        <section class="auth-card">

            <a href="../index.html" class="auth-logo">

                <img class="auth-logo-mark" src="../images/icons/leave-logo-dashboard.svg" alt="">

                <span>Recifix</span>

            </a>

            <button
                type="button"
                class="auth-close"
                onclick="closeAuth()"
                aria-label="Close">
                <span class="close-icon" aria-hidden="true"></span>
            </button>

            <div class="auth-header">

                <h1>
                    Welcome back
                </h1>

                <p>
                    Log in to continue cooking with what you have.
                </p>

            </div>

            <div class="divider">

                <span></span>
                <span></span>

            </div>

            <form
                class="auth-form"
                action="../dashboard.html"
                method="get"
                novalidate>

                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon"><img src="../images/icons/auth-email.svg" alt=""></span>

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required>

                    </div>

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon"><img src="../images/icons/lock.svg" alt=""></span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password">

                            <img src="../images/icons/eye.svg" alt="">

                        </button>

                    </div>

                </div>

                <div class="forgot-row">

                    <a href="#" id="forgotPasswordLink">
                        Forgot password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="auth-submit">

                    Log in

                </button>

            </form>

            <p class="switch-auth">

                Don't have an account?

                <a href="signup.html">
                    Create an account
                </a>

            </p>

            <p class="terms">

                By continuing, you agree to our
                <a href="#">
                    Terms of Service
                </a>
                and
                <a href="#">
                    Privacy Policy
                </a>.

            </p>

        </section>

    </main>

    <div class="password-modal" id="passwordModal" aria-hidden="true">
        <div class="password-dialog" role="dialog" aria-modal="true" aria-labelledby="passwordDialogTitle">
            <button type="button" class="password-dialog-close" id="closePasswordModal" aria-label="Close password reset"><img src="../images/icons/close.svg" alt=""></button>
            <span class="auth-kicker">ACCOUNT ACCESS</span>
            <h2 id="passwordDialogTitle">Reset your password</h2>
            <p>Enter your account email and choose a new password.</p>
            <form id="forgotPasswordForm" class="password-form" novalidate>
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" required>
                <label for="resetPassword">New password</label>
                <div class="password-field">
                    <input type="password" id="resetPassword" minlength="8" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('resetPassword', this)" aria-label="Show password"><img src="../images/icons/eye.svg" alt=""></button>
                </div>
                <label for="resetPasswordConfirm">Confirm new password</label>
                <div class="password-field">
                    <input type="password" id="resetPasswordConfirm" minlength="8" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('resetPasswordConfirm', this)" aria-label="Show password"><img src="../images/icons/eye.svg" alt=""></button>
                </div>
                <button type="submit" class="auth-submit">Save new password</button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/account.js"></script>

</body>

</html>
